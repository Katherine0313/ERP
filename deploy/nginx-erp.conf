# ERP 站点：erp.jiemids.com
#
# 站点同时承载两样东西：
#   1. 前端静态页面（erp-web 构建产物，放在站点根目录）
#   2. 后端 API（/api/ 前缀，反代到 127.0.0.1:8082，即 erp-boot 容器）
#
# SSL 说明：
#   EdgeOne 边缘已经有 erp.jiemids.com 的证书（浏览器侧已生效）。
#   源站这边也要配一份 —— EdgeOne 回源走的是 HTTP 80，
#   但直接访问源站 IP、或 EdgeOne 配置成 HTTPS 回源时都会用到源站证书。
#   证书路径按宝塔「网站 → SSL」里申请后的实际路径填写。
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name erp.jiemids.com;

    root /www/wwwroot/erp.jiemids.com;
    index index.html index.htm default.htm default.html;

    client_max_body_size 20m;

    ssl_certificate     /www/server/panel/vhost/cert/erp.jiemids.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/erp.jiemids.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ============ 后端 API ============
    # 同一个后端容器，前端与 APP / 小程序共用一套接口
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ============ 接口文档：生产不开放 ============
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger-ui { return 404; }
    location = /swagger-ui.html { return 404; }
    location ^~ /webjars/ { return 404; }

    # ============ 前端静态资源 ============
    # 带 hash 的构建产物可以长期缓存
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires      1y;
        add_header Cache-Control "public, immutable";
        access_log   off;
        error_log    off;
    }

    # 图片缓存 7 天（商品图会被替换）
    location ~* \.(gif|jpg|jpeg|png|bmp|webp|svg)$ {
        expires      7d;
        access_log   off;
    }

    # 单页应用：所有前端路由都回落到 index.html，交给 vue-router 处理
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ============ 安全 ============
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.git|docker-compose\.yml|Dockerfile|pom\.xml)$ {
        return 404;
    }
    location ~* /(\.git|\.svn|\.idea|\.vscode|node_modules)/ {
        return 404;
    }

    access_log  /www/wwwlogs/erp.jiemids.com.log;
    error_log   /www/wwwlogs/erp.jiemids.com.error.log;
}
