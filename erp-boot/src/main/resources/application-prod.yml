# prod profile 配置（生产环境）
#
# 本文件**不含任何凭据**，可以提交到版本库。
# 所有敏感值（数据库密码 / JWT 密钥 / Redis 密码）一律由环境变量注入，
# 由 deploy/docker-compose.yml 的 env_file 读取 deploy/.env。
#
# 激活方式：环境变量 SPRING_PROFILES_ACTIVE=prod
# （application.yml 里 spring.profiles.default=dev 只在没指定时才生效，
#   所以容器里必须显式给 SPRING_PROFILES_ACTIVE=prod）
spring:
  web:
    error:
      # 生产不外泄任何异常细节
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

# 生产不开放接口文档（Swagger UI 会暴露接口结构）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mybatis:
  configuration:
    # 生产不打印 SQL 与参数
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: INFO
    com.erp: INFO
    org.springdoc: WARN
