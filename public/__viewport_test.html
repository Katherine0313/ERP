<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Viewport responsive test harness</title>
<style>
  body { margin: 0; padding: 12px; background: #1e1e1e; font-family: system-ui, sans-serif; }
  .case { margin-bottom: 20px; }
  .label { color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  iframe { border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<div id="cases"></div>
<script>
const SIZES = [
  { key: 'desktop_1440x900', w: 1440, h: 900 },
  { key: 'tablet_900x800',   w: 900,  h: 800 },
  { key: 'mobile_390x844',   w: 390,  h: 844 },
  { key: 'edge_1024x800',    w: 1024, h: 800 },
  { key: 'edge_700x900',     w: 700,  h: 900 },
  { key: 'mq_767x800',       w: 767,  h: 800 },
  { key: 'mq_768x800',       w: 768,  h: 800 },
  { key: 'mq_1025x800',      w: 1025, h: 800 },
  { key: 'mq_500x800',       w: 500,  h: 800 },
];
const host = document.getElementById('cases');
for (const s of SIZES) host.appendChild(buildCase(s.key, s.w, s.h));
function buildCase(key, w, h) {
  const wrap = document.createElement('div');
  wrap.className = 'case';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = key + '  ' + w + 'x' + h;
  const f = document.createElement('iframe');
  f.width = String(w); f.height = String(h);
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.dataset.key = key;
  f.src = '/login';
  wrap.appendChild(label); wrap.appendChild(f);
  return wrap;
}
</script>
</body>
</html>
